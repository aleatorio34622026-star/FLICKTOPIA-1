<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLICKTOPIA</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

    <style>
        /* ===== TODO O CSS AQUI (igual ao que você já tem) ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ul {
            list-style: none;
        }
        button {
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }

        /* LOADER */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.5s, visibility 0.5s;
        }
        #loader.hide {
            opacity: 0;
            visibility: hidden;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(123, 63, 245, 0.1);
            border-top: 4px solid #7b3ff5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #loader h2 {
            margin-top: 20px;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #c084fc, #7b3ff5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* HEADER */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 40px;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 999;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.6rem;
            font-weight: 800;
        }
        .logo i {
            color: #7b3ff5;
            font-size: 1.8rem;
        }
        .logo span {
            background: linear-gradient(135deg, #c084fc, #7b3ff5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        nav ul {
            display: flex;
            gap: 28px;
            font-weight: 500;
        }
        nav ul a {
            color: #a0a0b8;
            transition: color 0.3s;
            position: relative;
            font-size: 0.95rem;
            cursor: pointer;
        }
        nav ul a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #7b3ff5, #c084fc);
            transition: width 0.3s;
        }
        nav ul a:hover::after,
        nav ul a.active::after {
            width: 100%;
        }
        nav ul a:hover,
        nav ul a.active {
            color: #fff;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #1a1a24;
            border-radius: 30px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.3s;
        }
        .search-box:focus-within {
            border-color: #7b3ff5;
        }
        .search-box i {
            color: #6a6a82;
            margin-right: 10px;
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.9rem;
            width: 180px;
            font-family: 'Poppins', sans-serif;
        }
        .search-box input::placeholder {
            color: #6a6a82;
        }
        #themeToggle {
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            padding: 8px 14px;
            color: #a0a0b8;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        #themeToggle:hover {
            border-color: #7b3ff5;
            color: #fff;
        }
        #loginBtn {
            background: linear-gradient(135deg, #7b3ff5, #c084fc);
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        #loginBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(123, 63, 245, 0.3);
        }
        #loginBtn i {
            margin-right: 6px;
        }

        /* HERO */
        .hero {
            position: relative;
            height: 70vh;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, #0a0a0f, #1a1030);
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(123, 63, 245, 0.08), transparent 60%);
            pointer-events: none;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgba(10, 10, 15, 0.8));
        }
        .hero-content {
            position: relative;
            z-index: 2;
            padding: 20px;
        }
        .hero-content h1 {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: -1px;
        }
        .hero-content h1 span {
            background: linear-gradient(135deg, #c084fc, #7b3ff5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-content p {
            font-size: 1.2rem;
            color: #a0a0b8;
            max-width: 500px;
            margin: 0 auto 30px;
        }
        .hero-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .hero-buttons button {
            padding: 12px 32px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s;
        }
        #exploreBtn {
            background: linear-gradient(135deg, #7b3ff5, #c084fc);
            border: none;
            color: #fff;
            box-shadow: 0 0 30px rgba(123, 63, 245, 0.3);
        }
        #exploreBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(123, 63, 245, 0.5);
        }
        #trailerBtn {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        #trailerBtn:hover {
            border-color: #7b3ff5;
            background: rgba(123, 63, 245, 0.1);
        }
        #trailerBtn i {
            margin-right: 8px;
        }

        /* CATEGORIAS */
        .categories {
            display: flex;
            gap: 10px;
            padding: 24px 40px;
            overflow-x: auto;
            background: rgba(10, 10, 15, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .category {
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            color: #a0a0b8;
            font-weight: 500;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .category:hover {
            border-color: #7b3ff5;
            color: #fff;
        }
        .category.active {
            background: linear-gradient(135deg, #7b3ff5, #c084fc);
            border-color: transparent;
            color: #fff;
        }

        /* FILMES */
        .movies-section {
            padding: 30px 40px 10px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
        }
        .section-header button {
            background: transparent;
            border: none;
            color: #7b3ff5;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .section-header button:hover {
            color: #c084fc;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .movie-card {
            background: #14141e;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(123, 63, 245, 0.3);
        }
        .movie-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #1a1a24;
        }
        .movie-card .movie-info {
            padding: 14px 16px 18px;
        }
        .movie-card .movie-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-card .movie-info .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #6a6a82;
            font-size: 0.8rem;
        }
        .movie-card .movie-info .rating {
            color: #fbbf24;
            font-weight: 600;
        }
        .movie-card .favorite-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 30px;
            padding: 4px 10px;
            color: #fff;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .movie-card .favorite-btn:hover {
            transform: scale(1.1);
        }
        .movie-card .favorite-btn.favorited {
            color: #fbbf24;
        }
        .movie-card .watch-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 0.75rem;
            width: 100%;
            justify-content: center;
            margin-top: 8px;
            transition: all 0.3s;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
        }
        .movie-card .watch-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.3);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #14141e;
            border-radius: 24px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                transform: scale(0.9) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .closeModal {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.8rem;
            color: #a0a0b8;
            cursor: pointer;
            z-index: 10;
            transition: color 0.3s;
        }
        .closeModal:hover {
            color: #fff;
        }
        .modal-banner {
            width: 100%;
            height: 250px;
            overflow: hidden;
            border-radius: 24px 24px 0 0;
        }
        .modal-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .modal-info {
            display: flex;
            gap: 24px;
            padding: 24px;
        }
        .poster {
            flex-shrink: 0;
            width: 180px;
        }
        .poster img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .details {
            flex: 1;
        }
        .details h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .movie-meta {
            display: flex;
            gap: 16px;
            color: #a0a0b8;
            font-size: 0.9rem;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .movie-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .details p {
            color: #b0b0c8;
            line-height: 1.7;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .cast {
            margin-bottom: 16px;
        }
        .cast h3 {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #a0a0b8;
        }
        #castContainer {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        #castContainer span {
            background: #1a1a24;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #b0b0c8;
        }
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .buttons button {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        #watchMovie {
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            color: #fff;
        }
        #watchMovie:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(244, 63, 94, 0.3);
        }
        #favoriteMovie {
            background: #1a1a24;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        #favoriteMovie:hover {
            border-color: #7b3ff5;
        }
        #favoriteMovie.favorited {
            background: #7b3ff5;
            color: #fff;
        }
        #shareMovie {
            background: #1a1a24;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        #shareMovie:hover {
            border-color: #7b3ff5;
        }

        /* LOGIN */
        .login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 9998;
            justify-content: center;
            align-items: center;
        }
        .login-modal.active {
            display: flex;
        }
        .login-box {
            background: #14141e;
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            animation: modalIn 0.3s ease;
        }
        .closeLogin {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.8rem;
            color: #a0a0b8;
            cursor: pointer;
            transition: color 0.3s;
        }
        .closeLogin:hover {
            color: #fff;
        }
        .login-box h2 {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
        }
        .login-box form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .login-box input {
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 14px 16px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-box input:focus {
            border-color: #7b3ff5;
        }
        .login-box input::placeholder {
            color: #6a6a82;
        }
        .login-box form button {
            background: linear-gradient(135deg, #7b3ff5, #c084fc);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .login-box form button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(123, 63, 245, 0.3);
        }
        .divider {
            text-align: center;
            color: #6a6a82;
            margin: 16px 0;
            font-size: 0.9rem;
        }
        .google-login {
            background: #1a1a24;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s;
            width: 100%;
            font-family: 'Poppins', sans-serif;
        }
        .google-login:hover {
            border-color: #7b3ff5;
        }
        .google-login i {
            margin-right: 10px;
        }
        .login-box p {
            text-align: center;
            color: #6a6a82;
            margin-top: 16px;
            font-size: 0.9rem;
        }
        .login-box p a {
            color: #7b3ff5;
            font-weight: 600;
        }
        .login-box p a:hover {
            color: #c084fc;
        }

        /* TOAST */
        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #14141e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px 24px;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 99999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
        }
        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* BOTÃO TOPO */
        #backToTop {
            position: fixed;
            bottom: 30px;
            left: 30px;
            background: linear-gradient(135deg, #7b3ff5, #c084fc);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            color: #fff;
            font-size: 1.2rem;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(123, 63, 245, 0.3);
            transition: all 0.3s;
            z-index: 999;
        }
        #backToTop.show {
            display: flex;
        }
        #backToTop:hover {
            transform: scale(1.1);
        }

        /* FOOTER */
        footer {
            background: #0a0a0f;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding: 40px 40px 20px;
            margin-top: 20px;
        }
        .footer-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .footer-container h2 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #c084fc, #7b3ff5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .footer-container p {
            color: #6a6a82;
            font-size: 0.9rem;
        }
        .footer-container h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .footer-container ul li {
            margin-bottom: 6px;
        }
        .footer-container ul a {
            color: #6a6a82;
            transition: color 0.3s;
            font-size: 0.9rem;
        }
        .footer-container ul a:hover {
            color: #fff;
        }
        .copyright {
            text-align: center;
            color: #4a4a5a;
            font-size: 0.8rem;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 20px;
        }

        /* RESPONSIVO */
        @media (max-width: 1024px) {
            header {
                padding: 14px 20px;
            }
            .search-box input {
                width: 120px;
            }
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            }
        }
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 12px 16px;
            }
            nav ul {
                justify-content: center;
                gap: 16px;
                flex-wrap: wrap;
                font-size: 0.85rem;
            }
            .header-actions {
                justify-content: center;
            }
            .search-box input {
                width: 140px;
            }
            .hero-content h1 {
                font-size: 2.5rem;
            }
            .categories {
                padding: 16px 16px;
            }
            .movies-section {
                padding: 20px 16px 10px;
            }
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 14px;
            }
            .modal-info {
                flex-direction: column;
                align-items: center;
            }
            .poster {
                width: 150px;
            }
            .footer-container {
